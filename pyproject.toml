[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "gramps-mcp"
version = "2.3.5"
description = "Gramps API + MCP Server + A2A Agent — genealogy (people/families/events/places/sources/media)"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "scion-sdk[mcp]>=0.6.0,<0.7.0", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
gramps-mcp = "scion_sdk.cli:serve"

# Fleet contribution (CONCEPT:OS-5.52): advertise this package's skills and
# system-prompt blueprints so scion-sdk' skill-installer and KG prompt
# library discover them without importing this package's agent code.

[project.entry-points."scion_sdk.prompt_providers"]
gramps-mcp = "gramps_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
gramps-mcp = "gramps_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
extend-exclude = ["tests", "scripts"]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
gramps_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "specs/*.json", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
host = "0.0.0.0"
home = "/home/gramps"
compose_env = ["GRAMPS_URL=${GRAMPS_URL:?supply GRAMPS_URL at runtime}", "GRAMPS_TOKEN=${GRAMPS_TOKEN:-}", "GRAMPS_USERNAME=${GRAMPS_USERNAME:-}", "GRAMPS_PASSWORD=${GRAMPS_PASSWORD:-}", "TLS_PROFILE=${TLS_PROFILE:-}", "TLS_PROFILES_REF=${TLS_PROFILES_REF:-}", "LANGFUSE_CAPTURE_CONTENT=${LANGFUSE_CAPTURE_CONTENT:-false}"]
